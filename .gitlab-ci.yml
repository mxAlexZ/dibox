variables:
  PYTHON_VERSION: "3.11"
  BASE_LAYER: bookworm-slim
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

image: ghcr.io/astral-sh/uv:python$PYTHON_VERSION-$BASE_LAYER

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /^CI Bot:/
      when: never
    - when: always

cache:
  key:
    files:
      - uv.lock
  paths:
    - $UV_CACHE_DIR

stages:
  - test
  - build
  - release
  - publish

after_script: &after_script
  - uv cache prune --ci

.rule_templates:
  merge_request: &merge_request
    if: $CI_PIPELINE_SOURCE == "merge_request_event"
  main_branch: &main_branch
    if: $CI_COMMIT_BRANCH == "main"

unit-tests:
  stage: test
  script:
    - uv sync
    - uv run pytest --cov=src --cov-report=xml --cov-report=term --junitxml=test_report.xml
  rules:
    - *main_branch
    - *merge_request
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    when: always
    reports:
      junit: test_report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 2 days

ruff:
  stage: test
  allow_failure: true
  script:
    - uv sync
    - uvx ruff check --output-format=gitlab | tee ruff_report.json
  rules:
    - *merge_request
  artifacts:
    when: always
    reports:
      codequality: ruff_report.json
    expire_in: 2 days

pyright:
  stage: test
  allow_failure: true
  before_script:
    - uv sync
    - apt-get update
    - apt-get install -y libatomic1
  script:
    # a trick to get pyright to setup node.js at the first run to avoid it messing up the output
    - uv run pyright || true
    - uv run pyright --outputjson | tee report_raw.json
  after_script:
    - uvx pyright-to-gitlab-ci --src report_raw.json --output pyright_report.json --base_path .
    - *after_script
  rules:
    - *merge_request
  artifacts:
    when: always
    reports:
      codequality: pyright_report.json
    expire_in: 2 days

zuban:
  stage: test
  allow_failure: true
  script:
    - uv sync
    - uv run zuban check src --pretty
    - uv run zuban check tests --allow-untyped-defs --allow-incomplete-defs --pretty
  rules:
    - *merge_request

prepare-release:
  stage: build
  rules:
    - *main_branch
  when: manual
  before_script:
    - apt-get -qq update && apt-get -qq install -y git openssh-client > /dev/null
    - eval $(ssh-agent -s)
    - cat "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan ${CI_SERVER_HOST} >> ~/.ssh/known_hosts
    - git remote set-url origin "git@${CI_SERVER_HOST}:${CI_PROJECT_PATH}.git"
    - git config user.name "GitLab CI"
    - git config user.email "ci-bot@noreply.gitlab.com"
    - git fetch --tags origin
  script:
    - uv version --bump patch
    - NEW_VERSION=$(uv version --short)
    - echo "RELEASE_VERSION=${NEW_VERSION}" | tee variables.env
    - uvx git-cliff --tag "v${NEW_VERSION}" --unreleased --prepend CHANGELOG.md
    - git add pyproject.toml uv.lock CHANGELOG.md
    - 'git commit -m "CI Bot: Bump version to ${NEW_VERSION}"'
    - git tag "v${NEW_VERSION}"
    - git push -o ci.skip origin HEAD:$CI_COMMIT_BRANCH
    - git push -o ci.skip origin "v${NEW_VERSION}"
    - uvx git-cliff --latest -o release_notes.md
    - echo "--- Release notes ---" && cat release_notes.md
    - uv build
  artifacts:
    paths:
      - release_notes.md
      - dist/
    reports:
      dotenv: variables.env

create-release:
  stage: release
  rules:
    - *main_branch
  needs: [prepare-release]
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script:
  script:
    - echo "Creating release v${RELEASE_VERSION}"
  release:
    tag_name: "v${RELEASE_VERSION}"
    name: "Release v${RELEASE_VERSION}"
    description: release_notes.md

publish-package-test:
  stage: publish
  needs: [create-release, prepare-release]
  when: manual
  script:
    - uv publish --index testpypi
  id_tokens:
    TESTPYPI_ID_TOKEN:
      aud: testpypi
  rules:
    - *main_branch

publish-package-pypi:
  stage: publish
  needs: [create-release, prepare-release]
  when: manual
  allow_failure: false
  script:
    - uv publish
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  rules:
    - *main_branch
