[project]
name = "dibox"
version = "0.1.8"
description = "Async-native dependency injection framework based on type hints"
authors = [
    {name = "Alex Zee", email = "alex.zee@outlook.cz"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["dependency injection", "async", "type hints", "lifecycle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
homepage = "https://gitlab.com/AlexZee/dibox"
source = "https://gitlab.com/AlexZee/dibox"
changelog = "https://gitlab.com/AlexZee/dibox/-/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "attrs>=25.4.0",
    "pyright>=1.1.408",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "zuban>=0.6.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
junit_family = "xunit2"
testpaths = ["tests"]
python_classes = ["Test*", "*Test"]

[tool.ruff]
extend-exclude = ["./docs"]
lint.select = ["E", "F", "I", "PT"]
line-length = 125

[tool.zuban]
check_untyped_defs = true
mypy_path = "src"
strict = true

[tool.pyright]
typeCheckingMode = "strict"
exclude = ["./docs", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
